const roles={'Executive':['overview','expansion','analytics'],'Regional Manager':['overview','stores','inventory','workforce','analytics'],'Store Manager':['overview','pos','orders','inventory','receiving','workforce','tasks'],'Merchandising Manager':['catalog','categories','promotions','analytics'],'Buyer / Procurement':['procurement','suppliers','purchase-orders'],'Warehouse Manager':['warehouse','receiving','transfers','inventory'],'Store Associate':['pos','orders','tasks'],'IT Program Manager':['expansion','programs','projects','releases','risks','analytics'],'Customer':['storefront','my-orders']};

const $=s=>document.querySelector(s);const money=n=>'$'+n.toLocaleString('en-US');function toast(m){state.toast=m;renderToast();setTimeout(()=>{state.toast='';renderToast()},2600)}function renderToast(){$('#toast')?.remove();if(state.toast){const d=document.createElement('div');d.id='toast';d.className='toast';d.textContent=state.toast;document.body.appendChild(d)}}
function setPage(p){state.page=p;state.search='';render()}function pageTitle(p){return pages.find(x=>x[0]===p)?.[1]||p}

function head(title,sub,action=''){return '<div class="page-head"><div><div class="eyebrow">MarketOps / '+title+'</div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions">'+action+'</div></div>'}
function btn(label,fn,cls=''){return '<button class="btn '+cls+'" onclick="'+fn+'">'+label+'</button>'}

function table(headers,rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}

<h3 class="section-title">Today's execution <small>Manager action queue</small></h3>'+state.tasks.map(t=>'<div class="task"><span class="task-icon">'+t.icon+'</span><div><b>'+t.title+'</b><p>'+t.desc+'</p></div><time>'+t.time+'</time></div>').join('')+'</div></div>'}

function modal(title,desc,body,action='Save'){ $('#overlay').innerHTML='<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>'+title+'</h2><p>'+desc+'</p>'+body+'<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveModal(\''+title+'\')">'+action+'</button></div></div></div>'}
function closeModal(){$('#overlay').innerHTML=''}
function saveModal(title){let name=$('#modalName')?.value||'New '+title.toLowerCase();if(title.toLowerCase().includes('inventory')){state.inventory.unshift({sku:'NEW-'+Math.floor(Math.random()*9000),name,dept:'Grocery',store:'Westside',onHand:10,par:20,status:'Replenish'})}if(title.toLowerCase().includes('task'))state.tasks.unshift({title:name,desc:$('#modalNotes')?.value||'Newly created action',time:'Just now',icon:'✓'});closeModal();render();toast(title+' saved in demo workspace')}

function adjustStock(sku){let item=state.inventory.find(x=>x.sku===sku);modal('Adjust inventory','Record a cycle count or stock correction for '+item.name+'.','<div class="field"><label>New on-hand quantity</label><input id="modalName" type="number" value="'+item.onHand+'"></div><div class="field"><label>Reason</label><select id="modalNotes"><option>Cycle count</option><option>Damage / spoilage</option><option>Receiving correction</option><option>Manual adjustment</option></select></div>','Save adjustment');$('#overlay').dataset.sku=sku}
function saveModal(title){let name=$('#modalName')?.value||'New '+title.toLowerCase();let sku=$('#overlay').dataset.sku;if(sku){let item=state.inventory.find(x=>x.sku===sku);item.onHand=Number(name);item.status=item.onHand===0?'Out of stock':item.onHand<item.par?'Replenish':'Healthy';}else if(title.toLowerCase().includes('inventory')){state.inventory.unshift({sku:'NEW-'+Math.floor(Math.random()*9000),name,dept:'Grocery',store:'Westside',onHand:10,par:20,status:'Replenish'})}else if(title.toLowerCase().includes('task'))state.tasks.unshift({title:name,desc:$('#modalNotes')?.value||'Newly created action',time:'Just now',icon:'✓'});closeModal();render();toast(title+' saved in demo workspace')}
function resolveTask(i){state.tasks.splice(i,1);render();toast('Task marked resolved')}
function searchTable(v){state.search=v;let el=document.activeElement;let pos=el?.selectionStart;render();let target=$('.search');if(target){target.focus();target.setSelectionRange(pos,pos)}}
function posSearch(v){$('#posItems').innerHTML=products.filter(p=>p.join(' ').toLowerCase().includes(v.toLowerCase())).map(p=>'<button class="btn" onclick="addCartByName(\''+p[0]+'\')">'+p[2]+' '+p[0]+'</button>').join('')}
function addCart(i){state.cart.push(products[i]);render();toast('Item added to basket')}
function addCartByName(n){let p=products.find(x=>x[0]===n);state.cart.push(p);render();toast('Item added to basket')}
function removeCart(i){state.cart.splice(i,1);render()}
function checkout(){if(!state.cart.length)return toast('Add items before completing sale');let total=money(state.cart.reduce((a,c)=>a+Number(c[3].replace('$','')),0));state.orders.unshift({items:state.cart.length+' items',total});state.cart=[];render();toast('Sale completed · '+total)}
function addStoreCart(n){let p=products.find(x=>x[0]===n);state.cart.push(p);toast(n+' added to basket · '+state.cart.length+' items');renderCartButton()}
function renderCartButton(){let old=$('#cartFloat');old?.remove();if(state.mode==='customer'){let b=document.createElement('button');b.id='cartFloat';b.className='store-cart';b.textContent='Basket · '+state.cart.length+' items';b.onclick=()=>modal('Your basket','Review your demo basket and continue to checkout.',cartMarkup(),'Checkout');document.body.appendChild(b)}}
function changeRole(r){state.role=r;state.page=(roles[r]||['overview'])[0];if(r==='Customer'){state.mode='customer';state.page='storefront'}else state.mode='ops';render()}
function toggleMode(){state.mode=state.mode==='ops'?'customer':'ops';state.role=state.mode==='ops'?'Regional Manager':'Customer';state.page=state.mode==='ops'?'overview':'storefront';render()}
function toggleMenu(){$('#sidebar').classList.toggle('open')}
function render(){document.body.classList.toggle('customer-mode',state.mode==='customer');let pagesMap={overview,stores:storesPage,catalog:catalogPage,categories:categoriesPage,promotions:promotionsPage,inventory:inventoryPage,procurement:procurementPage,suppliers:suppliersPage,'purchase-orders':poPage,warehouse:warehousePage,receiving:receivingPage,transfers:transfersPage,pos:posPage,orders:ordersPage,workforce:workforcePage,tasks:tasksPage,analytics:analyticsPage,expansion:expansionPage,programs:programsPage,projects:projectsPage,releases:releasesPage,risks:risksPage,storefront,myOrders};$('#app').innerHTML=header()+(state.mode==='ops'?'<div class="layout">'+sidebar()+'<main class="main">'+(pagesMap[state.page]||overview)()+'<div class="footer-note">MarketOps 360 · Illustrative retail operating model · Front-end demo only</div></main></div>':(state.page==='my-orders'?'<main class="main">'+myOrders()+'</main>':'<main>'+storefront()+'</main>'));renderCartButton();renderToast()}
render();
</script></body></html>
